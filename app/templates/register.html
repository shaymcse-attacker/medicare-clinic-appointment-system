{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<form method="post">
  <label>Name <input name="name" required></label><br>
  <label>Email <input name="email" type="email" required></label><br>
  <label>Password <input name="password" type="password" required></label><br>
  <label>Phone <input name="phone"></label><br>
  <label>Role
    <select name="role"><option>patient</option><option>doctor</option><option>admin</option></select>
  </label><br>
  <label>Specialization (doctors) <input name="specialization"></label><br>
  <label>Chamber (doctors) <input name="chamber"></label><br>
  <button type="submit">Register</button>
</form>
{% endblock %}
